name: ML Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: ML Model Training
        run: python train.py

      - name: ML Model Testing
        run: python test.py

      - name: Deployment
        if: success() && github.ref == 'refs/heads/main'
        run: echo "Deploying the model..."
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL}}
          run: curl --fail --silent --show-error "$DEPLOY_HOOK_URL"